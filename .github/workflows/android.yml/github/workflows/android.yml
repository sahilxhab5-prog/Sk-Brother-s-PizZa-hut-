
name: Build SK Brothers Pizza App

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract App
        run: |
          unzip -o sk_brothers_pizza_hut_android_source_with_logo.zip -d extracted

      - name: Create Android Project
        working-directory: extracted/sk_brothers_pizza_hut_app
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: extracted/sk_brothers_pizza_hut_app
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/sk_brothers_pizza_hut_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Brothers-Pizza-Hut-APK
          path: extracted/sk_brothers_pizza_hut_app/build/app/outputs/flutter-apk/app-release.apk
